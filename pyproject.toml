[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tontine-lightning"
version = "0.1.0"
description = "Couche Lightning (LNbits) de Tontine Lightning — Dakar Bitcoin Days 2026"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alassane Ndour" }]
dependencies = [
    "httpx>=0.27,<1",
    "bolt11>=2.1,<3",
    # bolt11 2.1.x casse avec bitstring 5 (ImportError ConstBitStream) : on fixe la version.
    "bitstring>=4,<5",
    # Python ≥ 3.14 : coincurve 21 n'existe qu'en sources (compilation impossible sous Windows sans
    # outils C) ; seule coincurve 19.0.1 fournit une roue précompilée « py3-none » (20.x = sources aussi).
    "coincurve==19.0.1; python_version >= '3.14'",
]

[project.optional-dependencies]
pont = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["tontine_lightning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
